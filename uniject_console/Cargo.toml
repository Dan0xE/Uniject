[package]
name = "uniject_console"
version = "0.2.0"
edition = "2024"

[dependencies]
uniject = {path = "../uniject"}
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
